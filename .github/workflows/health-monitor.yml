name: Health Monitor

# Polls the production /api/health liveness endpoint (src/app/api/health/route.ts)
# and turns a sustained non-200 into a pinned GitHub issue instead of silence.
# The endpoint 503s when Postgres is down, the cache is down in prod, or the
# queue plane has no consumers (see docs/runbooks/deploy.md "Alerting").
#
# OPS SETUP REQUIRED: set a repository secret named HEALTH_MONITOR_URL to the
# production health URL, e.g. https://<prod-host>/api/health (Settings ->
# Secrets and variables -> Actions -> New repository secret). Only the status
# code is read — no bearer token is sent, so this checks liveness only, not
# the authenticated detail body (HEALTH_DETAIL_TOKEN). Until the secret is
# set, this workflow SKIPS with a loud notice and reports success (green),
# rather than failing every 10 minutes for a config gap ops hasn't reached
# yet.
#
# Source of truth only: Backstory_customers mirrors this tree as an
# independent repo (not a fork), so its schedules fire too, but it has no
# HEALTH_MONITOR_URL secret and no production of its own to poll — the
# same guard used by eval-nightly.yml and backup-restore-proof.yml.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: health-monitor
  cancel-in-progress: false

jobs:
  check:
    if: github.repository == 'jamesmcdaniel-cyber/Backstory_Studio'
    runs-on: ubuntu-latest
    steps:
      - name: Check HEALTH_MONITOR_URL is configured
        id: config
        run: |
          if [ -z "${{ secrets.HEALTH_MONITOR_URL }}" ]; then
            echo "::warning::HEALTH_MONITOR_URL secret is not set — skipping the health check. Ops: add a repository secret named HEALTH_MONITOR_URL pointing at https://<prod-host>/api/health."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Curl production health endpoint
        id: probe
        if: steps.config.outputs.configured == 'true'
        run: |
          set +e
          status=$(curl --silent --output /tmp/health-body.json --write-out '%{http_code}' \
            --max-time 10 --retry 3 --retry-delay 5 --retry-all-errors \
            "${{ secrets.HEALTH_MONITOR_URL }}")
          code=$?
          echo "http_status=$status" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ] || [ "$status" != "200" ]; then
            echo "::error::Health check failed — HTTP $status (curl exit $code)"
            echo "healthy=false" >> "$GITHUB_OUTPUT"
          else
            echo "healthy=true" >> "$GITHUB_OUTPUT"
          fi
          cat /tmp/health-body.json 2>/dev/null || true

      - name: Open or update the pinned incident issue
        if: steps.config.outputs.configured == 'true' && steps.probe.outputs.healthy == 'false'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs')
            let body = 'No response body captured.'
            try { body = fs.readFileSync('/tmp/health-body.json', 'utf8').slice(0, 4000) } catch {}
            const status = '${{ steps.probe.outputs.http_status }}'
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const title = 'Production health check failing'

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'production-health',
            })

            const commentBody = [
              `Health check returned HTTP \`${status}\` at ${new Date().toISOString()}.`,
              '',
              `[Workflow run](${runUrl})`,
              '',
              '```json',
              body,
              '```',
              '',
              'See docs/runbooks/queue-incident.md and docs/runbooks/incident-response.md for triage.',
            ].join('\n')

            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: commentBody,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: commentBody,
                labels: ['production-health'],
              })
            }

      - name: Close the pinned incident issue on recovery
        if: steps.config.outputs.configured == 'true' && steps.probe.outputs.healthy == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'production-health',
            })
            for (const issue of existing.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Health check is passing again as of ${new Date().toISOString()} — closing.`,
              })
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              })
            }

      - name: Fail the job on an unhealthy check
        if: steps.config.outputs.configured == 'true' && steps.probe.outputs.healthy == 'false'
        run: exit 1
