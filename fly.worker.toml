# BullMQ worker on Fly.io — the queue plane's consumer (EXECUTION_MODE=queue).
# Fly-hosted equivalent of render.yaml's `backstory-worker`: same image
# (Dockerfile.worker), same env contract. Deploy with:
#   fly deploy --config fly.worker.toml
#
# IMPORTANT — one queue, one Redis: REDIS_URL (a secret, set via
# `fly secrets set`) must be the SAME Upstash rediss://…:6379 TCP URL Vercel
# uses to enqueue, or the worker consumes a queue nothing writes to.
#
# DATABASE_URL is NOT Vercel's string: this is a long-lived process running
# four BullMQ workers at AGENT_WORKER_CONCURRENCY each — use the transaction
# pooler with ?pgbouncer=true&connection_limit=20 (Vercel's connection_limit=1
# would queue ~20 concurrent jobs behind one connection → Prisma P2024).
#
# SECRETS (set via `fly secrets set NAME=value`) — the boot audit
# (src/lib/workers/assert-env.ts) enforces these, so a gap fails at deploy
# time instead of at a user's run:
#   fatal (worker refuses to boot):
#     REDIS_URL DATABASE_URL ENCRYPTION_KEY ANTHROPIC_API_KEY
#   warned (capability silently degrades without them):
#     SENTRY_DSN            — crashes/dead-letters console-only otherwise
#     NANGO_SECRET_KEY      — integration tools in flows fail
#     VOYAGE_API_KEY        — RAG embeddings unavailable
#     VAPID_PUBLIC_KEY VAPID_PRIVATE_KEY — run-completion push dropped
#     NEXT_PUBLIC_APP_URL   — notification links point nowhere
#     SUPABASE_SERVICE_ROLE_KEY — no realtime run updates (slow polling)
#   plus the rest of render.yaml's sync:false list (DIRECT_URL, NEO4J_*,
#   GRANOLA_API_KEY, SLACK_BOT_TOKEN, RESEND_API_KEY, PEOPLE_AI_*,
#   BACKSTORY_MCP_*, UPSTASH_REDIS_REST_*).
#
# The worker writes `worker:heartbeat` to Redis every 30s (heartbeat.ts);
# the web app refuses to enqueue flow runs when it is >2 min stale, and
# /api/health reports its age. A healthy fleet with a stale heartbeat means
# split-brain Redis — the exact render.yaml trap above.
#
# The worker ALSO drives the scheduling tick every 60s (dispatch-tick.ts),
# behind a Redis lock shared with the Vercel cron entry in vercel.json. Both
# planes are safe to run together; either surviving alone keeps schedules
# firing. This is what makes the "every 15 minutes" cadence real — the cron
# alone could only ever deliver 15-minute granularity with 15 minutes of
# drift, and a paused cron stopped every scheduled flow silently.
# /api/health reports the last tick's age as `queueConsumers.tick`.

app = "backstory-worker"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.worker"

[env]
  NODE_ENV = "production"
  EXECUTION_MODE = "queue"
  WORKER_PORT = "3002"
  # Consume only the queues someone is WAITING on: agent-execution,
  # scheduled-agent-execution, flow-execution. Operator batch work (template
  # generation, model bench, activity backfill) is served by fly.worker-batch.toml.
  #
  # Before the split, one long backfill over a slow provider API could hold
  # interactive slots for minutes while people's runs queued behind it — and
  # scaling this app did not fix that, it just bought more slots for the same
  # contention. Leaving WORKER_POOL unset consumes everything, which is the
  # pre-split behaviour and still correct for a single-machine deployment.
  WORKER_POOL = "interactive"
  # Per-worker, PER-QUEUE concurrency; the runtime starts four queues, so
  # in-flight jobs per machine ≈ 4x this. Size DATABASE_URL's connection_limit
  # against that product.
  AGENT_WORKER_CONCURRENCY = "5"
  # Per-workspace in-flight ceiling, enforced at dispatch (org-capacity.ts).
  ORG_MAX_INFLIGHT_RUNS = "10"
  AGENT_MODEL = "claude-opus-4-8"
  SUMMARY_MODEL = "claude-haiku-4-5"

# No [[services]] block on purpose: the worker takes no public traffic. The
# health endpoint is checked machine-locally.
[checks]
  [checks.health]
    type = "http"
    port = 3002
    path = "/health"
    # 60s, not 30s: every check pings Redis, and Upstash bills per command.
    interval = "60s"
    timeout = "10s"
    grace_period = "60s"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"
  # Competing consumers on one Redis — scale with `fly scale count N`.
  #
  # CAPACITY MATH, because the two ceilings here are easy to breach silently:
  #
  #   slots      = AGENT_WORKER_CONCURRENCY x (queues this pool consumes)
  #              = 5 x 3 = 15 in-flight jobs per machine
  #   fleet      = slots x machine count
  #   ORG_MAX_INFLIGHT_RUNS = 10 caps any ONE workspace's share of that fleet.
  #
  # At 3 machines the fleet is 45 slots, so FIVE busy workspaces saturate the
  # whole platform. That is the number to size against — not the user count.
  #
  # And every slot is a database connection: DATABASE_URL's connection_limit
  # must be >= slots, while (connection_limit x machine count) must stay under
  # the Supabase pooler's own client ceiling. connection_limit=20 x 3 machines
  # = 60 client connections from this app ALONE, before Vercel's lambdas take
  # theirs. Raise the machine count and the pooler plan together, or Prisma
  # starts throwing P2024 pool timeouts under exactly the load you scaled for.
  #
  # Fly does not autoscale a process with no [[services]] block on queue depth.
  # /api/cron/queue-watch is the signal; scaling is a deliberate
  # `fly scale count N` against it. See docs/runbooks/.
