name: Browser E2E
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  # The anonymous suite. Needs nothing but a reachable deployment, so it is the
  # gate: it runs on every pull request and its failure fails the workflow.
  anonymous:
    name: Anonymous journeys (3 browsers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npx playwright test --project=chromium --project=firefox --project=webkit
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_API_KEY: ${{ secrets.E2E_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-report-anonymous, path: playwright-report, retention-days: 14 }

  # The authenticated journeys. Split into its own job for two reasons: it needs
  # secrets the anonymous suite does not, and where those secrets are absent by
  # design (forks, fork PRs, the customers mirror) it must skip without turning
  # the workflow red, while still saying so out loud. On the source repository
  # absent secrets fail this job. Setup: docs/e2e-authenticated-setup.md.
  authenticated:
    name: Authenticated journeys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }

      # Secrets cannot be referenced in a job-level `if:`, so the decision is
      # made here and every later step keys off its output.
      #
      # Missing secrets mean two different things depending on WHERE this runs:
      #   - On a fork, a pull request from a fork, a Dependabot PR, or the
      #     Backstory_customers mirror, the secrets are absent BY DESIGN (GitHub
      #     withholds them, or the mirror deliberately holds none). The job
      #     skips with a notice and stays green.
      #   - Anywhere else (the source repository, whatever it is named) absent
      #     secrets are a configuration gap, and the job FAILS so the gap stays
      #     visible instead of hiding behind a green tick that looks exactly
      #     like passing journeys. Deliberately not keyed on the source repo's
      #     name: the repository has been renamed before.
      - id: gate
        name: Check for authenticated end-to-end secrets
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          E2E_DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
          IS_MIRROR: ${{ github.repository == 'jamesmcdaniel-cyber/Backstory_customers' }}
          IS_FORK: ${{ github.event.repository.fork == true }}
          PR_FROM_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          IS_DEPENDABOT: ${{ github.actor == 'dependabot[bot]' }}
        # Secrets are read through `env`, never interpolated into the script
        # body: `${{ secrets.X }}` inside `run:` splices the value into the
        # shell source, where a character like a quote or backtick in a
        # connection string becomes executable text.
        run: |
          where() {
            case "$1" in
              E2E_BASE_URL) echo "the deployment under test, e.g. https://<app>.vercel.app" ;;
              E2E_USER_EMAIL) echo "the address scripts/e2e/provision-test-account.ts provisioned" ;;
              E2E_USER_PASSWORD) echo "the password that script printed (or the one you passed it)" ;;
              E2E_SUPABASE_URL) echo "Supabase dashboard > Project Settings > API > Project URL" ;;
              E2E_SUPABASE_ANON_KEY) echo "Supabase dashboard > Project Settings > API > anon public key" ;;
            esac
          }
          missing=()
          for name in E2E_BASE_URL E2E_USER_EMAIL E2E_USER_PASSWORD E2E_SUPABASE_URL E2E_SUPABASE_ANON_KEY; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done

          if [ ${#missing[@]} -eq 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            if [ -z "$E2E_DATABASE_URL" ]; then
              echo "::notice title=Free-tier ceiling journey will skip::E2E_DATABASE_URL is not set, so the daily-run-cap journey cannot arrange its precondition and will report as skipped. Every other journey runs."
            fi
            exit 0
          fi

          echo "run=false" >> "$GITHUB_OUTPUT"
          reason=""
          if [ "$IS_MIRROR" = "true" ]; then reason="this is the Backstory_customers mirror, which holds no end-to-end credentials"
          elif [ "$IS_FORK" = "true" ]; then reason="this repository is a fork, which does not hold the source repository's secrets"
          elif [ "$PR_FROM_FORK" = "true" ]; then reason="this pull request comes from a fork, and GitHub withholds secrets from fork pull requests"
          elif [ "$IS_DEPENDABOT" = "true" ]; then reason="Dependabot runs without repository secrets"
          fi

          {
            if [ -n "$reason" ]; then echo "### Authenticated journeys skipped"; else echo "### Authenticated journeys cannot run: secrets missing"; fi
            echo
            echo "| Missing secret | Where the value comes from |"
            echo "|---|---|"
            for name in "${missing[@]}"; do echo "| \`$name\` | $(where "$name") |"; done
            echo
            if [ -n "$reason" ]; then
              echo "Skipped because $reason. That is expected here; the journeys run on the source repository."
            else
              echo "Set them under **Settings > Secrets and variables > Actions**. One-time setup: \`docs/e2e-authenticated-setup.md\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$reason" ]; then
            echo "::notice title=Authenticated E2E journeys skipped::Skipped because $reason. Missing: ${missing[*]}."
            exit 0
          fi
          for name in "${missing[@]}"; do
            echo "::error title=Missing secret ${name}::${name} is not set. It is $(where "$name"). See docs/e2e-authenticated-setup.md."
          done
          echo "::error title=Authenticated E2E journeys cannot run::Missing repository secrets: ${missing[*]}. The signed-in journeys did not run. One-time setup: docs/e2e-authenticated-setup.md."
          exit 1

      - if: steps.gate.outputs.run == 'true'
        run: npm ci
      # Chromium only: the journeys test product behaviour, not rendering
      # differences, and the anonymous job already covers three engines.
      - if: steps.gate.outputs.run == 'true'
        run: npx playwright install --with-deps chromium

      - if: steps.gate.outputs.run == 'true'
        name: Run authenticated journeys
        # "authenticated (limits)" depends on "authenticated", so Playwright
        # orders them: the ceiling journey spends the test account's daily run
        # allowance and must go last.
        run: npx playwright test --project=authenticated --project="authenticated (limits)"
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          # Optional. Absent → the free-tier journey skips with its reason.
          E2E_DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
          # Optional. Only needed if the Supabase project enforces Turnstile.
          E2E_CAPTCHA_TOKEN: ${{ secrets.E2E_CAPTCHA_TOKEN }}

      - uses: actions/upload-artifact@v4
        if: always() && steps.gate.outputs.run == 'true'
        with: { name: playwright-report-authenticated, path: playwright-report, retention-days: 14 }
